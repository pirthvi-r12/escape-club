services:
  db:
    image: postgres:16-alpine
    container_name: escape-club-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escape_club
    ports:
      - "5432:5432"
    volumes:
      - escape_club_pg:/var/lib/postgresql/data
      - ./database/escape-club.sql:/docker-entrypoint-initdb.d/escape-club.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escape_club"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  escape_club_pg:
